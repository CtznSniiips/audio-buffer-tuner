name: Release plugin

# Trigger by pushing a tag like v0.3.2 — the leading "v" is stripped and
# checked against plugin.json's own "version" field before anything is built,
# so a mismatched tag fails loudly instead of publishing a mislabeled zip.
on:
  push:
    tags:
      - "v*.*.*"

# Default GITHUB_TOKEN permissions are read-only on repos created after
# GitHub's 2023 default change. softprops/action-gh-release needs write
# access to create/update releases, or it fails with exactly the
# "Resource not accessible by integration" error this workflow hit.
permissions:
  contents: write

env:
  PLUGIN_SLUG: audio-buffer-tuner
  SRC_DIR: src

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        run: |
          tag="${GITHUB_REF_NAME}"          # e.g. v0.3.2
          version="${tag#v}"                # e.g. 0.3.2
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate plugin.json version matches the tag
        run: |
          json_version=$(jq -r '.version' "${SRC_DIR}/plugin.json")
          if [ "$json_version" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::plugin.json version ($json_version) does not match tag (${{ steps.ver.outputs.version }})"
            exit 1
          fi

      - name: Validate plugin.json is well-formed JSON
        run: jq empty "${SRC_DIR}/plugin.json"

      - name: Extract changelog section for this version
        id: changelog
        run: |
          python3 - "${{ steps.ver.outputs.version }}" << 'PYEOF'
          import re
          import sys

          version = sys.argv[1]
          with open("CHANGELOG.md") as f:
              lines = f.readlines()

          pattern = re.compile(r"^## \[" + re.escape(version) + r"\]")
          start = next((i for i, l in enumerate(lines) if pattern.match(l)), None)
          if start is None:
              print(
                  f"::error::No CHANGELOG.md entry found for version {version} "
                  f"(expected a line like '## [{version}] - YYYY-MM-DD')"
              )
              sys.exit(1)

          end = len(lines)
          for j in range(start + 1, len(lines)):
              if lines[j].startswith("## ["):
                  end = j
                  break

          section = "".join(lines[start + 1:end]).strip("\n")
          if not section:
              print(f"::error::CHANGELOG.md entry for {version} is empty")
              sys.exit(1)

          with open("changelog_section.md", "w") as f:
              f.write(section + "\n")
          print("Extracted section:")
          print(section)
          PYEOF
          {
            echo "body<<CHANGELOG_EOF"
            cat changelog_section.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build the release zip
        id: build
        run: |
          zip_name="${PLUGIN_SLUG}.zip"
          # IMPORTANT: contents of src/ go at the ZIP ROOT, not wrapped in a
          # "src/" folder. Dispatcharr's installer (_install_plugin_from_zip)
          # walks the archive for the shallowest plugin.py; if it's found at
          # the root, the plugin's key is derived from THIS ZIP'S FILENAME
          # (sanitized: spaces/hyphens -> underscores), not a folder name.
          # A "src/" wrapper folder would make the key become "src" instead
          # of "audio_buffer_tuner" — so this has to stay flat.
          (cd "$SRC_DIR" && zip -r "../$zip_name" . -q)
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$zip_name" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "md5=$(md5sum "$zip_name" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          ls -la "$zip_name"
          echo "--- zip contents (should be flat, no leading folder) ---"
          unzip -l "$zip_name"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: ${{ steps.build.outputs.zip_name }}
          body: |
            ${{ steps.changelog.outputs.body }}

            ---
            **SHA256:** `${{ steps.build.outputs.sha256 }}`
            **MD5:** `${{ steps.build.outputs.md5 }}`

            Install via the Dispatcharr Plugins marketplace, or manually by
            extracting into `/data/plugins/`.
